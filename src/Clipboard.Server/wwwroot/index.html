<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>World Wide Digital Clipboard</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main>
    <header class="title-row">
      <h1>World Wide Digital Clipboard</h1>
      <div class="title-actions" id="board-actions" hidden>
        <button type="button" id="copy-board" aria-label="Copy link">
          <svg class="icon-copy" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2"></rect>
            <path d="M5 15V5h10"></path>
          </svg>
          <svg class="icon-check" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.5 9.5 17 19 7"></path>
          </svg>
        </button>
        <button type="button" id="qr-board" aria-label="QR code" aria-expanded="false" aria-controls="qr-panel">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path d="M3 3h7v7H3V3zm1.8 1.8v3.4h3.4V4.8H4.8zM14 3h7v7h-7V3zm1.8 1.8v3.4h3.4V4.8h-3.4zM3 14h7v7H3v-7zm1.8 1.8v3.4h3.4v-3.4H4.8zM14 14h2.2v2.2H14V14zm3.2 0H21v2.2h-3.8V14zM14 17.2h2.2V21H14v-3.8zm3.2 2.2H21V21h-3.8v-1.6z"></path>
          </svg>
        </button>
      </div>
    </header>
    <p id="message">Loading…</p>
    <section id="board" hidden>
      <label id="drop" class="drop">
        <input id="picker" type="file" multiple>
        <span>Drop files here, or choose them. Paste text or images anywhere on the page.</span>
      </label>
      <p id="progress" aria-live="polite"></p>
      <p id="empty" hidden>Nothing here yet.</p>
      <ul id="files"></ul>
    </section>
    <section id="missing" hidden>
      <p>This clipboard does not exist.</p>
      <button type="button" id="new-board">Start a new clipboard</button>
    </section>
  </main>
  <footer id="about"></footer>
  <div id="qr-panel" hidden>
    <div class="qr-card" role="dialog" aria-modal="true" aria-label="QR code for this clipboard link">
      <div id="qr-code"></div>
    </div>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
